name: personal_expense_tracker
description: "Personal Expense Tracker App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Date Formatting
  intl: ^0.18.1

  # API
  dio: ^5.4.0

  # 🔥 Charts (Pie Chart)
  fl_chart: ^0.68.0

  # 🔥 Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/appIcon.jpeg"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#1B5E20"
  image: "assets/icon/appIcon.jpeg"
  android: true
  ios: true
  android_gravity: center
